name: YouTube download and release

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube URL. If downloads fail with 'not a bot', add repo secret YOUTUBE_COOKIES_B64 (base64 of Netscape cookies.txt)."
        required: true
        type: string

permissions:
  contents: write

jobs:
  youtube-zip-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Deno (yt-dlp EJS / YouTube player)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install ffmpeg and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Decode YouTube cookies (optional)
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -n "$YOUTUBE_COOKIES_B64" ]; then
            printf '%s' "$YOUTUBE_COOKIES_B64" | tr -d '\r\n ' | base64 -d > youtube_cookies.txt
            if [ -s youtube_cookies.txt ]; then
              echo "YOUTUBE_COOKIES_FILE=$PWD/youtube_cookies.txt" >> "$GITHUB_ENV"
              echo "Cookies decoded successfully ($(wc -c < youtube_cookies.txt) bytes)."
            else
              echo "Warning: decoded cookies file is empty." >&2
            fi
          else
            echo "No YOUTUBE_COOKIES_B64 secret found; download may fail on bot checks."
          fi

      - name: Download and zip video
        id: download
        env:
          YOUTUBE_URL: ${{ github.event.inputs.youtube_url }}
        run: |
          python scripts/youtube_download.py "$YOUTUBE_URL"

      - name: Generate release tag
        run: echo "TAG=youtube-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"

      - name: Create release and upload zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ steps.download.outputs.file_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}